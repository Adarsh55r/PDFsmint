<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#f0fdfa" />
    </linearGradient>
    <linearGradient id="og-mark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="og-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d9488" />
      <stop offset="1" stop-color="#115e59" />
    </linearGradient>
    <style>
      .wm { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect x="0" y="0" width="1200" height="12" fill="url(#og-mark-bg)" />

  <!-- Brand mark (scaled from the 40x40 favicon mark) -->
  <g transform="translate(150, 175) scale(7)">
    <rect width="40" height="40" rx="11" fill="url(#og-mark-bg)" />
    <path d="M14 8 H22 L28.5 14.5 V29.5 A2.5 2.5 0 0 1 26 32 H14 A2.5 2.5 0 0 1 11.5 29.5 V10.5 A2.5 2.5 0 0 1 14 8 Z" fill="#ffffff" />
    <path d="M22 8 V12 A2.5 2.5 0 0 0 24.5 14.5 H28.5 Z" fill="#99f6e4" />
    <g transform="rotate(18 20 20.5)">
      <path d="M20 13 C 23.5 16, 23.5 24, 20 28 C 16.5 24, 16.5 16, 20 13 Z" fill="url(#og-leaf)" />
      <path d="M20 15.5 C 19.5 19, 19.6 24, 20.6 27" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" />
    </g>
  </g>

  <!-- Wordmark -->
  <text x="470" y="290" class="wm" font-size="104">
    <tspan fill="#0f172a">PDFs</tspan><tspan fill="#0d9488">Mint</tspan>
  </text>

  <!-- Tagline -->
  <text x="474" y="360" class="body" font-size="42" fill="#475569">
    Free Online PDF &amp; Image Tools
  </text>

  <!-- Value props -->
  <text x="474" y="425" class="body" font-weight="600" font-size="26" fill="#0d9488">
    100% in your browser &#183; No uploads &#183; No sign-up
  </text>

  <!-- Footer strip -->
  <text x="150" y="555" class="body" font-size="24" fill="#94a3b8">
    Compress &#183; Merge &#183; Split &#183; Convert &#183; Edit &#8212; your files never leave your device
  </text>
</svg>
